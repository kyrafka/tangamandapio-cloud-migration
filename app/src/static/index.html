<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Portal B2B de demostración de Tangamandapio S.A.C." />
    <title>Tangamandapio S.A.C. | Portal B2B</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #071526; color: #e8f0fa; }
      main { max-width: 800px; margin: 10vh auto; padding: 2.5rem; }
      .eyebrow { color: #78c7ff; font-size: .8rem; font-weight: 700; letter-spacing: .12em; }
      h1 { font-size: clamp(2rem, 6vw, 4rem); margin: .3rem 0; }
      p { color: #b8c7d9; line-height: 1.6; }
      .status { padding: 1rem; border: 1px solid #24517c; border-radius: .75rem; background: #0c2138; }
      code { color: #95e5b3; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">TANGAMANDAPIO S.A.C. · CANAL B2B</p>
      <h1>Portal de pedidos</h1>
      <p>Aplicación de referencia para el canal comercial migrado a AWS. La API mantiene los pedidos y expone controles de salud para las pruebas operativas.</p>
      <section class="status" aria-label="Estado de la aplicación">
        <strong>Verificación disponible:</strong> <code>GET /health</code> y <code>GET /api/orders</code>.
      </section>
    </main>
  </body>
</html>
