global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tangamandapio-order-core
    metrics_path: /metrics
    static_configs:
      - targets: [aws-app:8080]
        labels:
          provider: AWS-reference
          service: order-core
  - job_name: tangamandapio-azure-contract
    metrics_path: /metrics
    static_configs:
      - targets: [azure-service:8081]
        labels:
          provider: Azure-contract
          service: wms-receiver
