services:
  aws-app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_PATH: /data/tangamandapio.db
      AZURE_FULFILLMENT_URL: http://azure-service:8081
      AZURE_FUNCTION_KEY: ${DEMO_FUNCTION_KEY:-local-demo-key}
      AWS_REGION_NAME: ${AWS_REGION_NAME:-us-east-1}
      ALARM_NOTIFICATION_TOPIC_ARN: ${ALARM_NOTIFICATION_TOPIC_ARN:-}
      METRICS_ENABLED: "true"
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin@tangamandapio.local}
      BOOTSTRAP_ADMIN_PASSWORD: "${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD before starting Compose}"
      APP_SESSION_SECRET: "${APP_SESSION_SECRET:?Set APP_SESSION_SECRET before starting Compose}"
      ERP_SMTP_HOST: ${ERP_SMTP_HOST:-mailpit}
      ERP_SMTP_PORT: ${ERP_SMTP_PORT:-1025}
      ERP_SMTP_SECURITY: ${ERP_SMTP_SECURITY:-none}
      ERP_SMTP_USERNAME: ${ERP_SMTP_USERNAME:-}
      ERP_SMTP_PASSWORD: ${ERP_SMTP_PASSWORD:-}
      ERP_SMTP_FROM: ${ERP_SMTP_FROM:-no-reply@tangamandapio.local}
      ERP_SMTP_RECIPIENT_DOMAIN: ${ERP_SMTP_RECIPIENT_DOMAIN:-tangamandapio.local}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - aws-data:/data
    depends_on:
      azure-service:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.27.4
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit-data:/data

  azure-service:
    build:
      context: .
      dockerfile: Dockerfile.azure
    environment:
      FUNCTION_KEY: ${DEMO_FUNCTION_KEY:-local-demo-key}
      AZURE_WMS_DATABASE_PATH: /data/azure-wms.db
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - azure-wms-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; key=os.getenv('FUNCTION_KEY',''); request=urllib.request.Request('http://localhost:8081/health', headers={'x-functions-key': key}); urllib.request.urlopen(request)"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["ops"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      aws-app:
        condition: service_healthy
      azure-service:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:11.2.0
    profiles: ["ops"]
    environment:
      GF_SECURITY_ADMIN_USER: opsadmin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-local-demo-only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  portainer:
    image: portainer/portainer-ce:2.21.5
    profiles: ["ops"]
    command: --http-disabled
    ports:
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data

volumes:
  aws-data:
  azure-wms-data:
  mailpit-data:
  prometheus-data:
  grafana-data:
  portainer-data:
