AWSTemplateFormatVersion: '2010-09-09'
Description: Generated PostgreSQL credentials for separate project application and backup SQL roles.

Parameters:
  ProjectName:
    Type: String
    Default: tangamandapio
    AllowedPattern: '[a-z0-9-]+'

Resources:
  RuntimeSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/rds/runtime'
      Description: Credentials for the PostgreSQL ERP runtime user.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"tangama_app_runtime"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
  BackupReaderSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub '${ProjectName}/rds/backup-reader'
      Description: Credentials for the PostgreSQL read-only backup user.
      GenerateSecretString:
        SecretStringTemplate: '{"username":"tangama_backup_reader"}'
        GenerateStringKey: password
        PasswordLength: 40
        ExcludePunctuation: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName

Outputs:
  RuntimeSecretArn:
    Value: !Ref RuntimeSecret
  BackupSecretArn:
    Value: !Ref BackupReaderSecret
