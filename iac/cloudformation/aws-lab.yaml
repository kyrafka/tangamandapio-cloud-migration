AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Laboratorio Tangamandapio: VPC segmentada, ALB, Auto Scaling, RDS PostgreSQL,
  S3, registros, alarmas y dashboard. Dise??ado para AWS Academy Learner Lab.

Parameters:
  ProjectName:
    Type: String
    Default: tangamandapio
    AllowedPattern: '[a-z0-9-]+'
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
  DBInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t4g.micro]
  ApplicationArtifactKey:
    Type: String
    Default: releases/portal-b2b-v1.tar.gz
    AllowedPattern: '[A-Za-z0-9._/-]+'
    Description: Artefacto versionado del portal, almacenado de forma privada en el bucket del proyecto.
  ApplicationArtifactRevision:
    Type: String
    Default: bootstrap
    AllowedPattern: '[A-Za-z0-9._-]+'
    Description: Identificador inmutable de la revisi??n del artefacto; fuerza una actualizaci??n gradual del ASG cuando cambia.
  DemoVoicePassword:
    Type: String
    Default: ''
    NoEcho: true
    Description: Contrase??a temporal para las dos cuentas de demostraci??n WebRTC. Vac??o no crea cuentas demo.
  AzureFulfillmentUrl:
    Type: String
    Default: ''
    AllowedPattern: '^$|^https://[a-z0-9-]+\.azurewebsites\.net$'
    Description: URL base de la Function App de Azure que recibe el outbox. Vac??o deja el outbox sin cablear.
  AzureFunctionKeySecret:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9/_-]+$'
    Description: Nombre del secreto de Secrets Manager que guarda la function key de Azure. El valor nunca entra en la plantilla.
  AlarmNotificationEmailPrimary:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Correo principal para las alarmas CloudWatch. Vacio no crea suscripciones.
  AlarmNotificationEmailAlternate:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[^@\s]+@[^@\s]+\.[^@\s]+$'
    Description: Correo alternativo para las alarmas CloudWatch. Vacio no crea suscripcion.
  CertificateArn:
    Type: String
    Default: ''
    AllowedPattern: '^$|^arn:aws:acm:[a-z0-9-]+:\d{12}:certificate/[0-9a-f-]{36}$'
    Description: ARN del certificado ACM (importado o validado) para el listener HTTPS 443. Vacio deja el ALB solo en HTTP.
  DatabaseMultiAZ:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Activa alta disponibilidad Multi-AZ para RDS. Eleva el costo; usar solo con una ventana y presupuesto aprobados.
  DatabaseBackupRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    MaxValue: 35
    Description: D??as de retenci??n de backups autom??ticos de RDS.
  EnableWaf:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Crea y asocia AWS WAF al ALB. Tiene costo y requiere aprobaci??n expl??cita.
  ManageWafAssociation:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Permite que este stack cree la asociaci??n WAF-ALB. Mantener false si la asociaci??n preexiste.
  EnableAwsBackup:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Crea un vault y plan AWS Backup para RDS/S3. Tiene costo y requiere aprobaci??n expl??cita.

Mappings:
  Network:
    Cidrs:
      Vpc: 10.10.0.0/16
      PublicA: 10.10.0.0/24
      PublicB: 10.10.1.0/24
      AppA: 10.10.10.0/24
      AppB: 10.10.11.0/24
      DBA: 10.10.20.0/24
      DBB: 10.10.21.0/24

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  HasAlarmEmailPrimary: !Not [!Equals [!Ref AlarmNotificationEmailPrimary, '']]
  HasAlarmEmailAlternate: !Not [!Equals [!Ref AlarmNotificationEmailAlternate, '']]
  UseDatabaseMultiAZ: !Equals [!Ref DatabaseMultiAZ, 'true']
  UseWaf: !Equals [!Ref EnableWaf, 'true']
  UseManagedWafAssociation: !And
    - !Condition UseWaf
    - !Equals [!Ref ManageWafAssociation, 'true']
  UseAwsBackup: !Equals [!Ref EnableAwsBackup, 'true']
  HasAlarmEmails: !Or
    - !Condition HasAlarmEmailPrimary
    - !Condition HasAlarmEmailAlternate

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !FindInMap [Network, Cidrs, Vpc]
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-vpc'}
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: ManagedBy, Value: cloudformation}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-igw'}
        - {Key: Project, Value: !Ref ProjectName}

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !FindInMap [Network, Cidrs, PublicA]
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-public-a'}
        - {Key: Tier, Value: public}
        - {Key: Project, Value: !Ref ProjectName}

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !FindInMap [Network, Cidrs, PublicB]
      MapPublicIpOnLaunch: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-public-b'}
        - {Key: Tier, Value: public}
        - {Key: Project, Value: !Ref ProjectName}

  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !FindInMap [Network, Cidrs, AppA]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-app-a'}
        - {Key: Tier, Value: app}
        - {Key: Project, Value: !Ref ProjectName}

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !FindInMap [Network, Cidrs, AppB]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-app-b'}
        - {Key: Tier, Value: app}
        - {Key: Project, Value: !Ref ProjectName}

  DBSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: !FindInMap [Network, Cidrs, DBA]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-db-a'}
        - {Key: Tier, Value: db}
        - {Key: Project, Value: !Ref ProjectName}

  DBSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: !FindInMap [Network, Cidrs, DBB]
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-db-b'}
        - {Key: Tier, Value: db}
        - {Key: Project, Value: !Ref ProjectName}

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-rt-public'}
        - {Key: Project, Value: !Ref ProjectName}

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable}
  PublicRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable}

  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      Domain: vpc
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-nat-eip'}
        - {Key: Project, Value: !Ref ProjectName}

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-nat'}
        - {Key: Project, Value: !Ref ProjectName}

  AppRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-rt-app'}
        - {Key: Project, Value: !Ref ProjectName}

  AppDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref AppRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  AppRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnetA, RouteTableId: !Ref AppRouteTable}
  AppRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref AppSubnetB, RouteTableId: !Ref AppRouteTable}

  DBRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-rt-db-isolated'}
        - {Key: Project, Value: !Ref ProjectName}

  DBRouteAssociationA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DBSubnetA, RouteTableId: !Ref DBRouteTable}
  DBRouteAssociationB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref DBSubnetB, RouteTableId: !Ref DBRouteTable}

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP access to the demo load balancer
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: Demo HTTP y redirect a HTTPS}
        - !If
          - HasCertificate
          - {IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: Demo HTTPS}
          - !Ref AWS::NoValue
      SecurityGroupEgress:
        - {IpProtocol: '-1', CidrIp: 0.0.0.0/0, Description: Forward traffic to application tier}
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-sg-alb'}
        - {Key: Project, Value: !Ref ProjectName}

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Application traffic only from ALB
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref ALBSecurityGroup, Description: ALB to app}
      SecurityGroupEgress:
        - {IpProtocol: '-1', CidrIp: 0.0.0.0/0, Description: Package installation and AWS APIs}
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-sg-app'}
        - {Key: Project, Value: !Ref ProjectName}

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL only from application tier
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - {IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup, Description: App to PostgreSQL}
      SecurityGroupEgress: []
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-sg-db'}
        - {Key: Project, Value: !Ref ProjectName}

  AssetBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectName}-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: ManagedBy, Value: cloudformation}

  DBSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub '${ProjectName}/rds/master'
      Description: Credenciales temporales de RDS para el laboratorio
      GenerateSecretString:
        SecretStringTemplate: '{"username":"tangama_admin"}'
        GenerateStringKey: password
        PasswordLength: 24
        ExcludePunctuation: true
      Tags:
        - {Key: Project, Value: !Ref ProjectName}

  PortalAdminSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub '${ProjectName}/portal/admin'
      Description: Credenciales iniciales del administrador del portal B2B
      GenerateSecretString:
        SecretStringTemplate: '{"username":"admin@tangamandapio.local"}'
        GenerateStringKey: password
        PasswordLength: 28
        ExcludePunctuation: true
      Tags:
        - {Key: Project, Value: !Ref ProjectName}

  PortalSessionSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub '${ProjectName}/portal/session'
      Description: Clave compartida para las sesiones del portal B2B
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: session_secret
        PasswordLength: 48
        ExcludePunctuation: true
      Tags:
        - {Key: Project, Value: !Ref ProjectName}

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private database subnets
      SubnetIds: [!Ref DBSubnetA, !Ref DBSubnetB]
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-db-subnets'}
        - {Key: Project, Value: !Ref ProjectName}

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-postgres'
      Engine: postgres
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: 20
      StorageType: gp3
      StorageEncrypted: true
      DBName: tangamandapio
      MasterUsername: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DBSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups: [!Ref DBSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: !If [UseDatabaseMultiAZ, true, false]
      BackupRetentionPeriod: !Ref DatabaseBackupRetentionDays
      DeleteAutomatedBackups: true
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-postgres'}
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: LabProfile, Value: cost-controlled}

  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub '/tangamandapio/${ProjectName}/application'
      RetentionInDays: 1
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: ManagedBy, Value: cloudformation}

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub '${ProjectName}-app'
      LaunchTemplateData:
        ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64}}'
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Name: LabInstanceProfile}
        SecurityGroupIds: [!Ref AppSecurityGroup]
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 8
              VolumeType: gp3
              Encrypted: true
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - {Key: Name, Value: !Sub '${ProjectName}-app'}
              - {Key: Project, Value: !Ref ProjectName}
              - {Key: ManagedBy, Value: cloudformation}
          - ResourceType: volume
            Tags:
              - {Key: Project, Value: !Ref ProjectName}
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -euo pipefail
            # Revisi??n inmutable del artefacto: ${ApplicationArtifactRevision}
            dnf install -y python3-pip
            dnf install -y amazon-cloudwatch-agent || true
            pip3 install --no-cache-dir flask gunicorn boto3 psycopg2-binary
            install -d -m 0755 /opt/tangamandapio
            install -d -m 0755 /opt/tangamandapio/static
            install -d -m 0755 /var/log/tangamandapio
            # La aplicacion completa (API, portal, roles y outbox) se publica como
            # artefacto privado y versionado en el bucket del proyecto. No se incrusta
            # codigo ni secretos en la plantilla para evitar divergencia entre lo
            # desplegado y el repositorio.
            # El portal y la API se publican como artefacto privado y versionado; esto
            # reemplaza cualquier interfaz embebida sin exponer c??digo ni secretos.
            aws s3 cp "s3://${AssetBucket}/${ApplicationArtifactKey}" /tmp/portal-b2b.tar.gz --region ${AWS::Region}
            tar -xzf /tmp/portal-b2b.tar.gz -C /opt/tangamandapio
            test -d /opt/tangamandapio/migrations
            pip3 install --no-cache-dir -r /opt/tangamandapio/requirements.txt
            install -d -m 0700 /etc/tangamandapio
            export DB_SECRET_JSON="$(aws secretsmanager get-secret-value --secret-id '${DBSecret}' --region ${AWS::Region} --query SecretString --output text)"
            export PORTAL_ADMIN_JSON="$(aws secretsmanager get-secret-value --secret-id '${PortalAdminSecret}' --region ${AWS::Region} --query SecretString --output text)"
            export PORTAL_SESSION_JSON="$(aws secretsmanager get-secret-value --secret-id '${PortalSessionSecret}' --region ${AWS::Region} --query SecretString --output text)"
            export AZURE_FUNCTION_KEY="$(aws secretsmanager get-secret-value --secret-id '${AzureFunctionKeySecret}' --region ${AWS::Region} --query SecretString --output text 2>/dev/null || true)"
            export AZURE_FULFILLMENT_URL='${AzureFulfillmentUrl}'
            export DEMO_VOICE_PASSWORD='${DemoVoicePassword}'
            export DATABASE_HOST='${Database.Endpoint.Address}'
            # La cookie segura solo tiene sentido cuando hay TLS en el ALB; si el
            # certificado no esta parametrizado la app debe seguir aceptando http.
            if [ -n "${CertificateArn}" ]; then export SECURE_COOKIE=true; else export SECURE_COOKIE=false; fi
            python3 - <<'PYENV'
            import json
            import os
            from urllib.parse import quote

            database = json.loads(os.environ["DB_SECRET_JSON"])
            admin = json.loads(os.environ["PORTAL_ADMIN_JSON"])
            session = json.loads(os.environ["PORTAL_SESSION_JSON"])
            database_url = "postgresql://{}:{}@{}:5432/tangamandapio".format(
                quote(database["username"], safe=""),
                quote(database["password"], safe=""),
                os.environ["DATABASE_HOST"],
            )
            lines = {
                "DATABASE_URL": database_url,
                "BOOTSTRAP_ADMIN_USERNAME": admin["username"],
                "BOOTSTRAP_ADMIN_PASSWORD": admin["password"],
                "DEMO_VOICE_PASSWORD": os.environ.get("DEMO_VOICE_PASSWORD", ""),
                "APP_SESSION_SECRET": session["session_secret"],
                "SESSION_COOKIE_SECURE": os.environ.get("SECURE_COOKIE", "false"),
                "AUTO_DISPATCH_EVENTS": "true",
                # Despacho fuera del ciclo HTTP: reintento programado con backoff.
                "OUTBOX_RETRY_INTERVAL": "60",
            }
            azure_url = os.environ.get("AZURE_FULFILLMENT_URL", "").strip()
            if azure_url:
                lines["AZURE_FULFILLMENT_URL"] = azure_url
                lines["AZURE_FUNCTION_KEY"] = os.environ.get(
                    "AZURE_FUNCTION_KEY", ""
                ).strip()
            with open("/etc/tangamandapio/application.env", "w", encoding="utf-8") as target:
                for key, value in lines.items():
                    target.write("{}={}\n".format(key, value.replace("\n", "")))
            os.chmod("/etc/tangamandapio/application.env", 0o600)
            PYENV
            id -u tangamandapio >/dev/null 2>&1 || useradd --system --home-dir /opt/tangamandapio --shell /sbin/nologin tangamandapio
            chown -R tangamandapio:tangamandapio /opt/tangamandapio /var/log/tangamandapio
            cat > /etc/systemd/system/tangamandapio.service <<'SERVICE'
            [Unit]
            Description=Tangamandapio demo application
            After=network-online.target
            Wants=network-online.target

            [Service]
            Type=simple
            Environment=AWS_REGION_NAME=${AWS::Region}
            Environment=DB_SECRET_ARN=${DBSecret}
            Environment=DB_HOST=${Database.Endpoint.Address}
            EnvironmentFile=/etc/tangamandapio/application.env
            WorkingDirectory=/opt/tangamandapio
            ExecStart=/usr/local/bin/gunicorn --bind 0.0.0.0:8080 --workers 2 --capture-output --access-logfile /var/log/tangamandapio/access.log --error-logfile /var/log/tangamandapio/error.log app:app
            Restart=always
            RestartSec=5
            User=tangamandapio
            Group=tangamandapio

            [Install]
            WantedBy=multi-user.target
            SERVICE
            systemctl daemon-reload
            systemctl enable --now tangamandapio
            if command -v /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl >/dev/null 2>&1; then
              cat > /opt/aws/amazon-cloudwatch-agent/etc/tangamandapio.json <<CWA
            {
              "agent": {"region": "${AWS::Region}"},
              "metrics": {
                "namespace": "Tangamandapio/Host",
                "metrics_collected": {
                  "mem": {
                    "measurement": ["mem_used_percent"],
                    "metrics_collection_interval": 60
                  },
                  "disk": {
                    "measurement": ["used_percent"],
                    "resources": ["/"],
                    "metrics_collection_interval": 60
                  },
                  "procstat": [
                    {
                      "pattern": "gunicorn",
                      "measurement": ["pid_count", "cpu_usage", "memory_rss"],
                      "metrics_collection_interval": 60
                    }
                  ]
                }
              },
              "logs": {
                "logs_collected": {
                  "files": {
                    "collect_list": [
                      {"file_path": "/var/log/tangamandapio/access.log", "log_group_name": "${ApplicationLogGroup}", "log_stream_name": "{instance_id}/access"},
                      {"file_path": "/var/log/tangamandapio/error.log", "log_group_name": "${ApplicationLogGroup}", "log_stream_name": "{instance_id}/error"}
                    ]
                  }
                }
              }
            }
            CWA
              /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/tangamandapio.json || true
            fi

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub '${ProjectName}-tg'
      VpcId: !Ref VPC
      Port: 8080
      Protocol: HTTP
      TargetType: instance
      HealthCheckEnabled: true
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: '200'}
      Tags:
        - {Key: Project, Value: !Ref ProjectName}

  AppLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub '${ProjectName}-alb'
      Scheme: internet-facing
      Type: application
      SecurityGroups: [!Ref ALBSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: ManagedBy, Value: cloudformation}

  HTTPListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref AppLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              Host: '#{host}'
              Path: '/#{path}'
              Query: '#{query}'
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HTTPSListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref AppLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  AutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: Database
    Properties:
      AutoScalingGroupName: !Sub '${ProjectName}-asg'
      VPCZoneIdentifier: [!Ref AppSubnetA, !Ref AppSubnetB]
      MinSize: '2'
      MaxSize: '4'
      DesiredCapacity: '2'
      HealthCheckType: ELB
      HealthCheckGracePeriod: 420
      TargetGroupARNs: [!Ref TargetGroup]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - {Key: Project, Value: !Ref ProjectName, PropagateAtLaunch: true}
        - {Key: ManagedBy, Value: cloudformation, PropagateAtLaunch: true}
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: 1
        MaxBatchSize: 1
        PauseTime: PT2M

  ScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: ASGAverageCPUUtilization
        TargetValue: 60
        DisableScaleIn: false

  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmails
    Properties:
      TopicName: !Sub '${ProjectName}-alarms'
      DisplayName: !Sub '${ProjectName} alarmas'
      Subscription:
        - !If
          - HasAlarmEmailPrimary
          - Protocol: email
            Endpoint: !Ref AlarmNotificationEmailPrimary
          - !Ref AWS::NoValue
        - !If
          - HasAlarmEmailAlternate
          - Protocol: email
            Endpoint: !Ref AlarmNotificationEmailAlternate
          - !Ref AWS::NoValue
      Tags:
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: LabProfile, Value: cost-controlled}

  HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-high-cpu'
      AlarmDescription: CPU promedio alta en la capa de aplicacion
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - {Name: AutoScalingGroupName, Value: !Ref AutoScalingGroup}
      Statistic: Average
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 70
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmails, [!Ref AlarmNotificationTopic], !Ref 'AWS::NoValue']
      OKActions: !If [HasAlarmEmails, [!Ref AlarmNotificationTopic], !Ref 'AWS::NoValue']

  UnhealthyTargetsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-unhealthy-targets'
      AlarmDescription: Uno o mas destinos del ALB no estan saludables
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - {Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName}
        - {Name: LoadBalancer, Value: !GetAtt AppLoadBalancer.LoadBalancerFullName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmails, [!Ref AlarmNotificationTopic], !Ref 'AWS::NoValue']
      OKActions: !If [HasAlarmEmails, [!Ref AlarmNotificationTopic], !Ref 'AWS::NoValue']

  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-target-5xx'
      AlarmDescription: Errores HTTP 5xx generados por la aplicacion
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - {Name: TargetGroup, Value: !GetAtt TargetGroup.TargetGroupFullName}
        - {Name: LoadBalancer, Value: !GetAtt AppLoadBalancer.LoadBalancerFullName}
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      DatapointsToAlarm: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmails, [!Ref AlarmNotificationTopic], !Ref 'AWS::NoValue']
      OKActions: !If [HasAlarmEmails, [!Ref AlarmNotificationTopic], !Ref 'AWS::NoValue']

  DatabaseCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-rds-high-cpu'
      AlarmDescription: CPU alta sostenida en RDS PostgreSQL
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - {Name: DBInstanceIdentifier, Value: !Ref Database}
      Statistic: Average
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 75
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmails, [!Ref AlarmNotificationTopic], !Ref 'AWS::NoValue']
      OKActions: !If [HasAlarmEmails, [!Ref AlarmNotificationTopic], !Ref 'AWS::NoValue']


  OperationsDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${ProjectName}-operations'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "CPU promedio - Auto Scaling Group",
                "region": "${AWS::Region}",
                "period": 60,
                "stat": "Average",
                "metrics": [["AWS/EC2", "CPUUtilization", "AutoScalingGroupName", "${AutoScalingGroup}"]]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Destinos saludables del ALB",
                "region": "${AWS::Region}",
                "period": 60,
                "stat": "Average",
                "metrics": [["AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${TargetGroup.TargetGroupFullName}", "LoadBalancer", "${AppLoadBalancer.LoadBalancerFullName}"]]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Latencia p95 y errores 5xx del ALB",
                "region": "${AWS::Region}",
                "period": 60,
                "metrics": [
                  ["AWS/ApplicationELB", "TargetResponseTime", "TargetGroup", "${TargetGroup.TargetGroupFullName}", "LoadBalancer", "${AppLoadBalancer.LoadBalancerFullName}", {"stat": "p95", "id": "m0"}],
                  ["AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "TargetGroup", "${TargetGroup.TargetGroupFullName}", "LoadBalancer", "${AppLoadBalancer.LoadBalancerFullName}", {"stat": "Sum", "id": "m1"}]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 6,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "RDS: CPU y conexiones",
                "region": "${AWS::Region}",
                "period": 60,
                "stat": "Average",
                "metrics": [
                  ["AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "${Database}"],
                  [".", "DatabaseConnections", ".", ".", {"yAxis": "right"}]
                ]
              }
            }
          ]
        }

  FilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub '${ProjectName}-files-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration: {Status: Enabled}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: TransicionInteligente
            Status: Enabled
            Transitions:
              - {StorageClass: STANDARD_IA, TransitionInDays: 30}
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 7}
      Tags:
        - {Key: Name, Value: !Sub '${ProjectName}-files'}
        - {Key: Project, Value: !Ref ProjectName}
        - {Key: ManagedBy, Value: cloudformation}

  FilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FilesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !Sub 'arn:aws:s3:::${FilesBucket}'
              - !Sub 'arn:aws:s3:::${FilesBucket}/*'
            Condition:
              Bool: {aws:SecureTransport: 'false'}

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: UseWaf
    Properties:
      Name: !Sub '${ProjectName}-alb'
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}-webacl'
      Rules:
        - Name: ManagedCommon
          Priority: 1
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: ManagedCommon
        - Name: ManagedBadInputs
          Priority: 2
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: ManagedBadInputs
        - Name: RateLimitPorIp
          Priority: 3
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              Limit: 1000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPorIp
      Tags:
        - {Key: Project, Value: !Ref ProjectName}

  WebAclAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Condition: UseManagedWafAssociation
    Properties:
      ResourceArn: !Ref AppLoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

  BackupVault:
    Type: AWS::Backup::BackupVault
    Condition: UseAwsBackup
    DeletionPolicy: Delete
    Properties:
      BackupVaultName: !Sub '${ProjectName}-vault'
      BackupVaultTags:
        Project: !Ref ProjectName

  BackupPlan:
    Type: AWS::Backup::BackupPlan
    Condition: UseAwsBackup
    Properties:
      BackupPlan:
        BackupPlanName: !Sub '${ProjectName}-plan'
        BackupPlanRule:
          - RuleName: Diaria0700
            TargetBackupVault: !Ref BackupVault
            ScheduleExpression: 'cron(0 12 * * ? *)'
            StartWindowMinutes: 60
            CompletionWindowMinutes: 180
            Lifecycle: {DeleteAfterDays: 7}
            RecoveryPointTags:
              Project: !Ref ProjectName
      BackupPlanTags:
        Project: !Ref ProjectName

  BackupSelection:
    Type: AWS::Backup::BackupSelection
    Condition: UseAwsBackup
    Properties:
      BackupPlanId: !Ref BackupPlan
      BackupSelection:
        SelectionName: !Sub '${ProjectName}-recursos'
        IamRoleArn: !Sub 'arn:aws:iam::${AWS::AccountId}:role/aws-service-role/backup.amazonaws.com/AWSServiceRoleForBackup'
        Resources:
          - !GetAtt Database.DBInstanceArn
          - !Sub 'arn:aws:s3:::${AssetBucket}'
          - !Sub 'arn:aws:s3:::${FilesBucket}'

Outputs:
  ApplicationURL:
    Description: URL p??blica de la demostraci??n; HTTPS solo si se proporcion?? CertificateArn.
    Value: !If
      - HasCertificate
      - !Sub 'https://${AppLoadBalancer.DNSName}'
      - !Sub 'http://${AppLoadBalancer.DNSName}'
  LoadBalancerDNS:
    Value: !GetAtt AppLoadBalancer.DNSName
  VpcId:
    Value: !Ref VPC
  AssetBucketName:
    Value: !Ref AssetBucket
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DashboardName:
    Value: !Ref OperationsDashboard
  ApplicationLogGroupName:
    Value: !Ref ApplicationLogGroup
  FilesBucketName:
    Description: Bucket de archivos del datacenter migrado
    Value: !Ref FilesBucket
  WebAclArn:
    Condition: UseWaf
    Description: Perimetro WAF asociado al ALB
    Value: !GetAtt WebAcl.Arn
  BackupPlanId:
    Condition: UseAwsBackup
    Description: Plan de AWS Backup (RDS y S3)
    Value: !Ref BackupPlan
