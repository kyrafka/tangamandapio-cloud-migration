AWSTemplateFormatVersion: '2010-09-09'
Description: Isolated Tangamandapio Tailscale pilot router; no routes or DNS changes.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Application subnet with outbound access to Systems Manager.
  ImageId:
    Type: AWS::EC2::Image::Id
    Default: ami-033ea4ff4a9c726dc
  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile

Resources:
  RouterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Outbound-only pilot router; forwarding not enabled.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: Tangamandapio
  Router:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: t3.micro
      SubnetId: !Ref PrivateSubnetId
      IamInstanceProfile: !Ref InstanceProfileName
      SecurityGroupIds: [!Ref RouterSecurityGroup]
      SourceDestCheck: false
      MetadataOptions:
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: tangamandapio-tailscale-pilot
        - Key: Project
          Value: Tangamandapio
        - Key: ManagedBy
          Value: CloudFormation

Outputs:
  RouterInstanceId:
    Value: !Ref Router
  RouterSecurityGroupId:
    Value: !Ref RouterSecurityGroup
