AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Single-node AWS subnet router using an Azure VPN Gateway Point-to-Site OpenVPN
  client. Routes only the Azure WMS private endpoint from the application
  subnets; this is not an AWS-managed Site-to-Site VPN and excludes RDS.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  PrivateSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Existing private application subnet with NAT egress for SSM and Azure P2S.
  AppRouteTableId:
    Type: String
    AllowedPattern: '^rtb-[0-9a-f]+$'
  InstanceProfileName:
    Type: String
    Default: LabInstanceProfile
    Description: Existing lab instance profile with Systems Manager managed-node access.
    AllowedPattern: '^[A-Za-z0-9+=,.@_-]{1,128}$'
  ImageId:
    Type: AWS::EC2::Image::Id
    Default: ami-033ea4ff4a9c726dc
    Description: Verified Canonical Ubuntu 22.04 amd64 AMI for us-east-1; refresh before rebuilding in another region.
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues: [t3.micro, t3.small]
  AzurePrivateEndpointIp:
    Type: String
    Default: 10.20.1.4
    AllowedPattern: '^10\.20\.1\.[0-9]{1,3}$'
  AzureFunctionHostname:
    Type: String
    Default: tangama-wms-flex-261013.azurewebsites.net
    AllowedPattern: '^[a-z0-9][a-z0-9-]{0,58}[a-z0-9]\.azurewebsites\.net$'
  AppRouteCidr:
    Type: String
    Default: 10.10.10.0/23
    AllowedValues: [10.10.10.0/23]
  EnablePrivateRoute:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Enable only after OpenVPN reaches Azure and the WMS private endpoint passes a connectivity check.

Conditions:
  PrivatePathEnabled: !Equals [!Ref EnablePrivateRoute, 'true']

Resources:
  P2SRouterSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow only application HTTPS forwarding to the P2S router.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref AppRouteCidr
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: tangamandapio-azure-p2s-router
        - Key: Project
          Value: Tangamandapio
        - Key: ManagedBy
          Value: CloudFormation

  P2SRouter:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref PrivateSubnetId
      IamInstanceProfile: !Ref InstanceProfileName
      SecurityGroupIds: [!Ref P2SRouterSecurityGroup]
      SourceDestCheck: false
      MetadataOptions:
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 12
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -y
          apt-get install -y openvpn openssl iptables
          install -d -m 0700 /etc/openvpn/client/tangama-azure
          cat > /etc/sysctl.d/99-tangama-p2s-router.conf <<'EOF'
          net.ipv4.ip_forward=1
          EOF
          sysctl --system
          printf 'TANGAMA_P2S_BOOTSTRAP=complete\n' > /dev/console
      Tags:
        - Key: Name
          Value: tangamandapio-azure-p2s-router
        - Key: Project
          Value: Tangamandapio
        - Key: ManagedBy
          Value: CloudFormation

  AzurePrivateRoute:
    Type: AWS::EC2::Route
    Condition: PrivatePathEnabled
    DependsOn: P2SRouter
    Properties:
      RouteTableId: !Ref AppRouteTableId
      DestinationCidrBlock: !Sub '${AzurePrivateEndpointIp}/32'
      InstanceId: !Ref P2SRouter

  AzureFunctionPrivateZone:
    Type: AWS::Route53::HostedZone
    Condition: PrivatePathEnabled
    Properties:
      Name: !Ref AzureFunctionHostname
      HostedZoneConfig:
        Comment: Private resolution of the Azure WMS Flex endpoint to its Private Endpoint.
      VPCs:
        - VPCId: !Ref VpcId
          VPCRegion: !Ref AWS::Region

  AzureFunctionPrivateRecord:
    Type: AWS::Route53::RecordSet
    Condition: PrivatePathEnabled
    Properties:
      HostedZoneId: !Ref AzureFunctionPrivateZone
      Name: !Ref AzureFunctionHostname
      Type: A
      TTL: '60'
      ResourceRecords: [!Ref AzurePrivateEndpointIp]

Outputs:
  RouterInstanceId:
    Value: !Ref P2SRouter
  RouterSecurityGroupId:
    Value: !Ref P2SRouterSecurityGroup
  AzurePrivateEndpointIp:
    Value: !Ref AzurePrivateEndpointIp
  AzureFunctionHostname:
    Value: !Ref AzureFunctionHostname
  AzurePrivateZoneId:
    Condition: PrivatePathEnabled
    Value: !Ref AzureFunctionPrivateZone
  AppRouteTableId:
    Value: !Ref AppRouteTableId
