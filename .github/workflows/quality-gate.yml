name: Tangamandapio quality gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-flow:
    name: Backend, Azure worker and flow tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: app/requirements-ci.lock

      - name: Install hashed Python lock
        run: python -m pip install --disable-pip-version-check --require-hashes -r app/requirements-ci.lock

      - name: Verify lock covers current manifests
        run: python tests/check_python_lock.py

      - name: Compile Python sources
        run: python -m compileall -q app/src app/azure_function app/aws_release/current

      - name: API tests
        working-directory: app
        run: python -m unittest discover -s tests -v

      - name: Azure Function tests
        run: python -m unittest discover -s app/azure_function_tests -v

      - name: AWS release tests
        working-directory: app/aws_release
        run: python -m unittest discover -s tests -v

      - name: Python dependency audit
        run: pip-audit -r app/requirements-ci.lock --progress-spinner off

      - name: Local health and performance smoke test
        working-directory: app
        run: |
          gunicorn --bind 127.0.0.1:18080 --workers 2 src.app:app >/tmp/tangamandapio.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if python -c "import urllib.request; response=urllib.request.urlopen('http://127.0.0.1:18080/health', timeout=2); assert response.status == 200"; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              cat /tmp/tangamandapio.log
              exit 1
            fi
            sleep 1
          done
          python ../tests/performance/load_test.py --url http://127.0.0.1:18080/health --requests 50 --concurrency 5 --max-p95-ms 2000

  frontend:
    name: Reproducible frontend build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: app/web/pnpm-lock.yaml

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.9.1
          run_install: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build without replacing Flask-served assets
        run: pnpm run build:check

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  infrastructure:
    name: AWS and Azure infrastructure validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install hashed validation-tool lock
        run: python -m pip install --disable-pip-version-check --require-hashes -r app/requirements-ci.lock

      - name: Validate CloudFormation templates
        run: cfn-lint iac/cloudformation/aws-lab.yaml iac/cloudformation/voice-recordings.yaml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.16.0'
          terraform_wrapper: false

      - name: Format and validate both Terraform environments
        run: |
          set -euo pipefail
          for directory in iac/environments/demo iac/environments/azure-demo; do
            terraform -chdir="$directory" fmt -check -recursive
            terraform -chdir="$directory" init -backend=false -input=false -lockfile=readonly -no-color
            terraform -chdir="$directory" validate -no-color
          done

      - name: Check shell syntax
        run: bash -n iac/cloudformation/*.sh tests/aws/*.sh
